name: Feature request
description: Propose a check, a fix, an export or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to find out or fix in your project, and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Name the area, what the check would read, what the verdict or fix would be, and which budget the numbers belong to.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap fit
      description: Where you think this belongs. Maintainers make the final call.
      options:
        - "Phase 1 - Read-only areas (v0.1.0)"
        - "Phase 2 - Memory, Assets and fixes (v0.5.0)"
        - "Phase 3 - Performance, Code Quality, extensibility (v1.0.0)"
        - "Later"
        - "Not sure"
